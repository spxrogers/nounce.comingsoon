<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skoop — coming soon</title>
  <meta name="description" content="Skoop — social connection without the social media. Coming soon.">
  <meta property="og:title" content="Skoop — coming soon">
  <meta property="og:description" content="Social connection without the social media. Coming soon.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FBF6F4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='21' r='15' fill='%233A6FA8'/%3E%3Cpath d='M20 40h24L32 62z' fill='%23DFEAF7'/%3E%3C/svg%3E">
  <style>
    /* Self-contained on purpose: no fonts, scripts, or images fetched from anyone else. */
    :root {
      --ground: #FBF6F4; --surface: #FFFFFF; --ink: #2B2320; --muted: #7B6B66;
      --accent: #3A6FA8; --accent-soft: #DFEAF7; --accent-hover: #2B5687; --line: #EBDDD7;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--ground); color: var(--ink); font-family: var(--sans);
      font-size: 17px; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .card {
      width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 20px; padding: 40px 32px; text-align: center;
    }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: 56px; line-height: 1; letter-spacing: -0.01em; margin: 0 0 8px; }
    h1 em { font-style: italic; color: var(--accent); }
    .tag { font-family: var(--serif); font-size: 22px; line-height: 1.3; margin: 0 0 24px; color: var(--ink); }
    p { margin: 0 0 16px; color: var(--muted); }
    .pill {
      display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .refuse { margin: 28px 0 0; padding-top: 24px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
    .refuse span { white-space: nowrap; }
    .refuse span + span::before { content: "·"; margin: 0 10px; color: var(--line); }
    footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 24px 28px; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { color: var(--accent-hover); text-decoration: underline; }
    @media (max-width: 420px) { h1 { font-size: 46px; } .card { padding: 32px 22px; } .refuse span + span::before { margin: 0 6px; } }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: rise 600ms ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Skoop mark">
        <circle cx="32" cy="21" r="15" fill="#3A6FA8"/>
        <path d="M20 40h24L32 62z" fill="#DFEAF7"/>
      </svg>
      <h1 id="title">Sk<em>oo</em>p</h1>
      <p class="tag">Social connection without the social media.</p>
      <p>Share your life and connect with loved ones the way we were meant to.</p>
      <span class="pill">Coming soon</span>
      <p class="refuse">
        <span>No feed</span><span>No likes</span><span>No tracking</span>
      </p>
    </section>
  </main>
  <footer>Skoop.</footer>
</body>
</html>
